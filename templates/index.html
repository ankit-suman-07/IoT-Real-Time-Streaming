<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bike Rental Predictions</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f5f9;
      color: #334155;
      padding: 2rem;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .top-bar h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .top-bar p {
      font-size: 13px;
      color: #94a3b8;
    }

    .submitted-by {
      text-align: right;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 14px;
    }

    .submitted-by span {
      display: block;
      font-weight: 500;
      color: #475569;
    }

    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      min-width: 150px;
    }

    .card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .card .value {
      font-size: 28px;
      font-weight: 600;
      color: #3b82f6;
    }

    .chart-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .chart-box .chart-title {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      background: #f8fafc;
      padding: 10px 16px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      border-bottom: 1px solid #e2e8f0;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
      color: #475569;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: #f8fafc; }

    .badge {
      background: #dbeafe;
      color: #2563eb;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>🚴 Real-Time Bike Rental Predictions</h1>
    <p>Live predictions streaming from Kafka · ENGR 5785G — Assignment 1</p>
  </div>
  <div class="submitted-by">
    Submitted by
    <span>Ankit Suman</span>
    <span>101041764</span>
  </div>
</div>

<div class="stats">
  <div class="card">
    <div class="label">Latest prediction</div>
    <div class="value" id="latest">--</div>
  </div>
  <div class="card">
    <div class="label">Total received</div>
    <div class="value" id="total">0</div>
  </div>
  <div class="card">
    <div class="label">Current hour</div>
    <div class="value" id="hour">--</div>
  </div>
</div>

<div class="chart-box">
  <div class="chart-title">Predicted rentals over time (last 20 records)</div>
  <canvas id="chart" height="90"></canvas>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Hour</th>
      <th>Predicted Rentals</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<script>
  const socket = io();
  let count = 0;
  const labels = [];
  const dataPoints = [];

  const ctx = document.getElementById('chart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Predicted Rentals',
        data: dataPoints,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.07)',
        borderWidth: 2,
        pointRadius: 3,
        pointBackgroundColor: '#3b82f6',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      animation: false,
      scales: {
        x: {
          ticks: { color: '#94a3b8', font: { size: 11 } },
          grid: { color: '#f1f5f9' }
        },
        y: {
          ticks: { color: '#94a3b8', font: { size: 11 } },
          grid: { color: '#f1f5f9' }
        }
      },
      plugins: {
        legend: { labels: { color: '#64748b', font: { size: 12 } } }
      }
    }
  });

  socket.on('prediction', (data) => {
    count++;

    document.getElementById('latest').textContent = data.predicted;
    document.getElementById('total').textContent = count;
    document.getElementById('hour').textContent = data.hour;

    labels.push('Row ' + count);
    dataPoints.push(data.predicted);
    if (labels.length > 20) { labels.shift(); dataPoints.shift(); }
    chart.update();

    const tbody = document.getElementById('table-body');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${count}</td>
      <td>${data.hour}:00</td>
      <td>${data.predicted}</td>
      <td><span class="badge">Live</span></td>
    `;
    tbody.insertBefore(tr, tbody.firstChild);

    if (tbody.rows.length > 10) {
      tbody.deleteRow(tbody.rows.length - 1);
    }
  });
</script>

</body>
</html>
